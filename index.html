<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpine Ascents | Beyond Limits. Above the Clouds.</title>
    <meta name="description" content="Alpine Ascents is the premier international mountaineering, high-altitude expedition, Gilgit-Baltistan discovery, and interactive expedition planning platform." />
    <meta name="keywords" content="mountaineering, alpine ascents, expeditions, K2, Everest, Karakoram, Gilgit-Baltistan, mountain guide, trekking, high altitude, passu cones, hunza" />
    <meta name="theme-color" content="#070c12" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- PWA Web Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Urdu Font Support -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Cache-Control Meta Tags: Prevent stale index.html caching across browser sessions -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Actively unregister any legacy service workers and clear stale CacheStorage
      // to eliminate 404 white screens on refresh caused by outdated asset hashes
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (const registration of registrations) {
            registration.unregister().then((success) => {
              if (success) console.log('[SW] Legacy service worker unregistered');
            });
          }
        }).catch((err) => {
          console.warn('[SW] Service worker cleanup error:', err);
        });
      }
      if ('caches' in window) {
        caches.keys().then((keys) => {
          for (const key of keys) {
            caches.delete(key).then(() => {
              console.log('[Cache] Purged legacy cache:', key);
            });
          }
        }).catch((err) => {
          console.warn('[Cache] Cache purge error:', err);
        });
      }
    </script>
  </body>
</html>
